name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select pinned Lean and obtain Mathlib cache
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Run source, arithmetic, kernel, and axiom checks
        run: bash scripts/verify.sh

      - name: Record pinned revisions
        run: |
          git rev-parse HEAD
          lake env lean --version
          git -C .lake/packages/mathlib rev-parse HEAD
